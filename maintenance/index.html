<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网站维护中</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        padding: 2rem;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #6e6e73;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>网站暂时下线维护</h1>
      <p>个人网站正在进行更新，请稍后再访问。感谢您的理解。</p>
    </main>
  </body>
</html>
