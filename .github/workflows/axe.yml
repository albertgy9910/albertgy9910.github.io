I am Albert (Geyang) Xu, a software engineer with experience in full-stack development, research, and data systems. I received my M.S. in Computer Science from UC San Diego (GPA 3.88/4.0), and a B.S. in Computer Science from the University of Liverpool (GPA 3.93/4.0, top 3%).

Currently, I work as a Software Engineer at 4Pexonic Inc., where I develop large-scale project management platforms using Angular, Ruby, and PostgreSQL. Concurrently, I serve as a Full-Stack Engineer at Spesland, helping build GovChat, an AI-powered city service platform used in over 200 municipalities. My stack includes Node.js, Next.js, MongoDB, and Docker.

Previously, I contributed as a Web Developer at the UCSD ECE Department and as a Research Engineer at the Halıcıoğlu Data Science Institute. There, I built frameworks for injecting data quality issues into machine learning datasets and optimizing server performance on Django-based platforms.

My technical skills include Python, Java, Go, SQL, React, Docker, Django, and AWS. I’m passionate about solving impactful problems through robust engineering and research.

You can find me on [LinkedIn](https://www.linkedin.com/in/albert-xu-a611a51bb/), [GitHub](https://github.com/albertgy9910), or follow my photography on [Instagram](https://www.instagram.com/albert.x10?igsh=OGQ5ZDc2ODk2ZA%3D%3D&utm_source=qr).
